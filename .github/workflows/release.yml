name: Release

# A tag like v0.1.0 builds the packages for every platform and creates a draft GitHub release
# with them; publish it from the Releases page after checking it. Run by hand (Actions, Release,
# Run workflow) it only builds the packages, as artifacts of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must match the version in Cargo.toml, or packages would carry another version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }

  # .tar.gz, .deb and AppImage. Linked against glibc 2.28 (cargo-zigbuild), so they run on RHEL 8 too.
  linux:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-zigbuild
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*

  # A universal BranchBlitz.app (unsigned) for Apple Silicon and Intel.
  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  # A .zip with branchblitz.exe (unsigned).
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --profile dist --locked
      - shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "branchblitz-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "stage/$name", dist | Out-Null
          Copy-Item target/dist/branchblitz.exe, README.md, LICENSE-MIT, LICENSE-APACHE "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  # Collects everything and checksums it; only a tag creates the (draft) release.
  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && ls -l
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "BranchBlitz $GITHUB_REF_NAME"
